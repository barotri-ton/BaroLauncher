name: Android 9 TV cloud UI smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/testing/tv_emulator_smoke.sh'
      - '.github/workflows/android9-tv-ui.yml'
permissions:
  contents: read
jobs:
  tv-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate shell
        run: bash -n tools/testing/tv_emulator_smoke.sh
      - name: Install build dependencies
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build APK
        run: ./build.sh
      - name: Start Android TV 9 (API 28) and test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: android-tv
          profile: tv_1080p
          ram-size: 1024M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: bash tools/testing/tv_emulator_smoke.sh
      - name: Upload UI evidence even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android9-tv-ui-smoke-evidence
          path: evidence/tv-ui/
          if-no-files-found: warn
          retention-days: 14
