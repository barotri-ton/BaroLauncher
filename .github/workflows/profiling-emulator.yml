name: Android 9 profiling emulator baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/profiling/**'
      - '.github/workflows/profiling-emulator.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build APK
        run: ./build.sh
      - name: Capture API 28 emulator screening baseline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 1024M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            set -eu
            echo "Waiting for Android package manager readiness"
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 30); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1; then
                ready=1
                break
              fi
              echo "Package manager not ready ($attempt/30)"
              sleep 10
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Android package manager did not become ready"
              adb devices -l || true
              adb shell getprop sys.boot_completed || true
              adb logcat -d -t 300 | tail -100 || true
              exit 1
            fi
            installed=0
            for attempt in 1 2 3; do
              echo "Installing BaroLauncher.apk (attempt $attempt/3)"
              if timeout 180 adb install --no-streaming -r build/BaroLauncher.apk; then
                installed=1
                break
              fi
              adb devices -l || true
              adb shell cmd package list packages >/dev/null 2>&1 || true
              adb logcat -d -t 200 | tail -60 || true
              adb reconnect offline || true
              sleep 15
            done
            if [ "$installed" -ne 1 ]; then
              echo "::error::APK installation failed after 3 attempts"
              exit 1
            fi
            bash tools/profiling/profile.sh --kind emulator --serial emulator-5554 --runs 5 --settle 120 --apk build/BaroLauncher.apk --network on --toggles default --out evidence/profiling/ci-emulator-5-cycle
      - name: Validate full baseline evidence
        run: python3 tools/profiling/validate_evidence.py evidence/profiling/ci-emulator-5-cycle
      - name: Regression safety evidence
        if: always()
        run: |
          if [ -f evidence/profiling/ci-emulator-5-cycle/environment/home-before.txt ] && [ -f evidence/profiling/ci-emulator-5-cycle/environment/home-after.txt ]; then
            diff -u evidence/profiling/ci-emulator-5-cycle/environment/home-before.txt evidence/profiling/ci-emulator-5-cycle/environment/home-after.txt
          fi
          if [ -f evidence/profiling/ci-emulator-5-cycle/environment/accessibility-before.txt ] && [ -f evidence/profiling/ci-emulator-5-cycle/environment/accessibility-after.txt ]; then
            diff -u evidence/profiling/ci-emulator-5-cycle/environment/accessibility-before.txt evidence/profiling/ci-emulator-5-cycle/environment/accessibility-after.txt
          fi
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android9-api28-emulator-profiling
          path: evidence/profiling/
          if-no-files-found: warn
          retention-days: 14
