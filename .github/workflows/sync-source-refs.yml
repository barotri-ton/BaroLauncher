name: One-time source refs migration
on:
  push:
    paths:
      - .github/workflows/sync-source-refs.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy original branches and tags
        run: |
          set -euo pipefail
          git remote add source https://github.com/barotri-ton/material-tv-launcher.git
          git fetch source '+refs/heads/*:refs/remotes/source/*' --tags
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/source/); do
            if [ "$ref" != "source/main" ]; then
              name="${ref#source/}"
              git checkout -B "$name" "refs/remotes/$ref"
              git rm -r --ignore-unmatch .github/workflows
              git -c user.name="BaroLauncher Import" -c user.email="actions@users.noreply.github.com" commit -m "Import branch history; defer workflow restoration" || true
              git push origin "$name"
            fi
          done
          git push origin --tags
