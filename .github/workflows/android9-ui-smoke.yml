name: Android 9 cloud UI smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'res/**'
      - 'assets/**'
      - 'AndroidManifest.xml'
      - 'build.sh'
      - 'VERSION'
      - 'tools/ui-smoke/**'
      - '.github/workflows/android9-ui-smoke.yml'
permissions:
  contents: read
concurrency:
  group: android9-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android9-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate scripts
        run: bash -n tools/ui-smoke/run.sh
      - name: Build APK
        run: ./build.sh
      - name: Emulator smoke and evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 1024M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            adb install -r build/material-tv-launcher.apk
            bash tools/ui-smoke/run.sh evidence/ui-smoke
      - name: Upload screenshots and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android9-cloud-ui-evidence
          path: evidence/ui-smoke/
          if-no-files-found: warn
          retention-days: 14
