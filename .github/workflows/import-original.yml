name: Import original Material TV Launcher repository
on:
  push:
    paths:
      - .github/workflows/import-original.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BaroLauncher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import source and Git history
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/import-original.yml /tmp/barolauncher-import.yml
          git remote add source https://github.com/barotri-ton/material-tv-launcher.git
          git fetch source '+refs/heads/*:refs/remotes/source/*' --tags
          git checkout -B main refs/remotes/source/main
          git rm .github/workflows/build-apk.yml
          mkdir -p .github/workflows
          cp /tmp/barolauncher-import.yml .github/workflows/import-original.yml
          git add .github/workflows/import-original.yml
          git -c user.name="BaroLauncher Import" -c user.email="actions@users.noreply.github.com" commit -m "Import source history; defer workflow restoration"
          git push --force origin main
